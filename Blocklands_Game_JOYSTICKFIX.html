<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blocklands — Voxel Sandbox</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b9f5;font-family:system-ui,Arial;color:#fff}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:1px 2px #222}#top{position:absolute;top:12px;left:12px;background:#0007;padding:8px 12px;border-radius:8px;font-size:13px}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:300}#hotbar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}.slot{width:52px;height:52px;border:2px solid #777;background:#222b;display:grid;place-items:center;font-size:11px;position:relative}.slot.selected{border:3px solid white;background:#777b;transform:translateY(-3px)}.swatch{width:26px;height:26px;border:2px solid #ffffff55;image-rendering:pixelated}.count{position:absolute;right:3px;bottom:1px;font-size:12px}#hint{position:absolute;top:12px;right:12px;background:#0007;padding:8px;border-radius:8px;font-size:12px;max-width:240px}#mobile{display:none;pointer-events:auto;position:absolute;inset:auto 0 85px 0;height:150px}#stick{position:absolute;left:22px;bottom:0;width:118px;height:118px;border-radius:50%;background:#ffffff24;border:2px solid #ffffff77;touch-action:none}#nub{position:absolute;left:36px;top:36px;width:42px;height:42px;border-radius:50%;background:#ffffff80}#actions{position:absolute;right:16px;bottom:0;display:grid;grid-template-columns:repeat(2,64px);gap:8px}button{border:1px solid #ffffff99;border-radius:12px;background:#222a;color:white;font-weight:700;padding:12px 6px;touch-action:manipulation}#actions button{height:58px;font-size:12px}#start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#466e9cbb,#182333ee),#466e9c;z-index:4}#panel{background:#182333f2;padding:24px;border:3px solid #ffffff66;border-radius:3px;width:min(480px,94vw);margin:16px;text-align:center;box-shadow:inset 0 0 0 3px #1118}#panel h1{margin:0 0 8px;font-size:clamp(32px,7vw,48px);text-shadow:3px 3px #333}#panel p{line-height:1.5;font-size:14px}#go,#newWorld,#backMenu{font-size:16px;background:#477b38;padding:12px 24px;width:100%;margin-top:8px;border-radius:2px}#newWorld{background:#555}#worldOptions{display:none;text-align:left}#worldOptions label{display:block;font-size:13px;margin:12px 0 4px}#worldOptions input,#worldOptions select{width:100%;padding:10px;background:#222;color:#fff;border:1px solid #aaa;font-size:16px}#loading{display:none;position:fixed;inset:0;z-index:6;background:#182333f5;place-items:center;text-align:center;padding:24px}#loadCard{width:min(420px,90vw)}#progressOuter{height:22px;border:2px solid #bbb;background:#333;padding:2px;margin-top:14px}#progressFill{height:100%;width:0;background:repeating-linear-gradient(90deg,#4f8e39 0 14px,#76b64c 14px 28px)}#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#0009;border-radius:8px;padding:6px 12px;opacity:0;transition:opacity .2s}@media(max-width:700px),(pointer:coarse){#mobile{display:block}#hint{top:55px;right:8px;max-width:150px;font-size:10px}#hotbar{bottom:8px;gap:2px}.slot{width:39px;height:43px}.swatch{width:22px;height:22px}#top{font-size:11px}#cross{font-size:20px}}
</style>
</head>
<body>
<div id="hud"><div id="top">BLOCKLANDS · Survival Sandbox<br><span id="stats">Generating world…</span></div><div id="hint">WASD move · Mouse look<br>Click mine · Right-click place<br>Space jump · 1–6 select · Esc unlock</div><div id="cross">+</div><div id="toast"></div><div id="hotbar"></div><div id="mobile"><div id="stick"><div id="nub"></div></div><div id="actions"><button id="mine">MINE</button><button id="place">PLACE</button><button id="jump">JUMP</button><button id="switch">NEXT BLOCK</button></div></div></div>
<div id="start"><div id="panel"><h1>BLOCKLANDS</h1><div style="font-size:12px;color:#ddd;margin-bottom:20px">SURVIVAL SANDBOX</div><div id="mainOptions"><button id="go">Singleplayer · Play World</button><button id="newWorld">Create New World</button><p style="font-size:11px;color:#bbb">A fan-made voxel sandbox · Not affiliated with Mojang</p></div><div id="worldOptions"><label for="worldName">World name</label><input id="worldName" value="My World" maxlength="32"><label for="worldSize">World size</label><select id="worldSize"><option value="28">Small</option><option value="40" selected>Normal</option><option value="56">Large</option></select><button id="createWorld" style="width:100%;margin-top:14px;background:#477b38">Create New World</button><button id="backMenu" style="background:#555">Back</button></div></div></div><div id="loading"><div id="loadCard"><h2 id="loadTitle">Generating world…</h2><div id="loadStatus">Preparing terrain</div><div id="progressOuter"><div id="progressFill"></div></div><div id="progressPercent">0%</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87b9f5); scene.fog=new THREE.Fog(0x87b9f5,24,72);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,120); camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xcce4ff,0x58452b,1.4);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d1,2.0);sun.position.set(30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const tileColors={grass_top:[88,142,49],grass_side:[112,153,58],dirt:[126,83,49],stone:[126,126,126],wood_side:[111,73,39],wood_end:[160,119,69],leaves:[44,105,38],planks:[177,135,76],sand:[218,201,132],coal:[120,120,120],bedrock:[58,58,58],water:[48,104,196]};
let textureSeed=1122;
function texRand(){textureSeed=(textureSeed*1664525+1013904223)>>>0;return textureSeed/4294967296}
function tileMat(name){
 const c=document.createElement('canvas');c.width=16;c.height=16;const cx=c.getContext('2d');const base=tileColors[name]||tileColors.dirt;
 cx.fillStyle=`rgb(${base.join(',')})`;cx.fillRect(0,0,16,16);
 for(let i=0;i<52;i++){const delta=Math.floor(texRand()*66)-35;cx.fillStyle=`rgb(${base.map(v=>Math.max(0,Math.min(255,v+delta))).join(',')})`;cx.fillRect(Math.floor(texRand()*16),Math.floor(texRand()*16),1,1)}
 if(name==='grass_side'){cx.fillStyle='#418028';for(let x=0;x<16;x++)cx.fillRect(x,0,1,2+(x>>2)%2)}
 if(name==='wood_side'){cx.fillStyle='#52341d';for(const x of [3,7,12])cx.fillRect(x,0,1,16)}
 if(name==='wood_end'){cx.strokeStyle='#734d2a';cx.strokeRect(2.5,2.5,11,11);cx.strokeRect(5.5,5.5,5,5)}
 if(name==='planks'){cx.fillStyle='#7e5a2f';for(const y of [4,9,14])cx.fillRect(0,y,16,1)}
 if(name==='leaves'){for(let i=0;i<22;i++){cx.fillStyle=['#1b501c','#3e822a','#134b1b'][Math.floor(texRand()*3)];cx.fillRect(Math.floor(texRand()*16),Math.floor(texRand()*16),1,1)}}
 if(name==='coal'){for(let i=0;i<7;i++){cx.fillStyle='#282828';cx.fillRect(1+Math.floor(texRand()*13),1+Math.floor(texRand()*13),2,2)}}
 if(name==='bedrock'){cx.fillStyle='#1c1c1c';for(let i=0;i<12;i++)cx.fillRect(Math.floor(texRand()*16),Math.floor(texRand()*16),3,2)}
 if(name==='water'){cx.fillStyle='#4382da';cx.fillRect(0,4,16,1);cx.fillRect(0,10,16,1)}
 const tex=new THREE.CanvasTexture(c);tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;tex.colorSpace=THREE.SRGBColorSpace;
 return new THREE.MeshLambertMaterial({map:tex})
}
const tileMats={};for(const n of Object.keys(tileColors))tileMats[n]=tileMat(n);
const mats={
 grass:[tileMats.grass_side,tileMats.grass_side,tileMats.grass_top,tileMats.dirt,tileMats.grass_side,tileMats.grass_side],
 dirt:tileMats.dirt,stone:tileMats.stone,
 wood:[tileMats.wood_side,tileMats.wood_side,tileMats.wood_end,tileMats.wood_end,tileMats.wood_side,tileMats.wood_side],
 leaves:tileMats.leaves,sand:tileMats.sand,planks:tileMats.planks,bedrock:tileMats.bedrock,water:tileMats.water,coal:tileMats.coal
};
const cube=new THREE.BoxGeometry(1,1,1);let blocks=new Map(),groups={},blockMeshes=[],meshToType=new Map();const key=(x,y,z)=>`${x},${y},${z}`;const put=(x,y,z,t)=>blocks.set(key(x,y,z),{x,y,z,t});const get=(x,y,z)=>blocks.get(key(x,y,z));
let seed=7281;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function heightAt(x,z){return Math.max(4,Math.floor(4+Math.sin(x*.22)*2+Math.cos(z*.19)*2+Math.sin((x+z)*.12)*2))}
let W=40;
async function generateWorld(size=40){
 W=size;seed=7281;blocks.clear();
 const overlay=document.getElementById('loading'),fill=document.getElementById('progressFill'),percent=document.getElementById('progressPercent'),status=document.getElementById('loadStatus');
 overlay.style.display='grid';fill.style.width='0%';percent.textContent='0%';status.textContent='Preparing terrain';
 for(let x=-W/2;x<W/2;x++){
  for(let z=-W/2;z<W/2;z++){
   let h=heightAt(x,z);
   for(let y=0;y<=h;y++){let t=y===h?(h<=4?'sand':'grass'):(y>h-3?'dirt':'stone');if(y===0)t='bedrock';if(y<h-3&&rand()<.018)t='coal';put(x,y,z,t)}
   if(h>4&&rand()<.035&&!(Math.abs(x)<=3&&Math.abs(z)<=3)){let tx=x,tz=z,base=h+1,th=3+Math.floor(rand()*3);for(let j=0;j<th;j++)put(tx,base+j,tz,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=-1;dy<=2;dy++)if(Math.abs(dx)+Math.abs(dz)+Math.max(0,dy-1)<4&&!get(tx+dx,base+th-1+dy,tz+dz))put(tx+dx,base+th-1+dy,tz+dz,'leaves')}
  }
  const n=x+W/2+1,p=Math.round(n/W*85);fill.style.width=p+'%';percent.textContent=p+'%';status.textContent=`Generating terrain · row ${n} of ${W}`;
  await new Promise(resolve=>setTimeout(resolve,0));
 }
 status.textContent='Building block meshes…';fill.style.width='94%';percent.textContent='94%';
 rebuild();
 fill.style.width='100%';percent.textContent='100%';status.textContent='World ready!';
 await new Promise(resolve=>setTimeout(resolve,220));overlay.style.display='none';
}
function rebuild(){for(const m of blockMeshes)scene.remove(m);blockMeshes=[];meshToType.clear();groups={};const buckets={};for(const b of blocks.values())(buckets[b.t]??=[]).push(b);for(const [type,arr] of Object.entries(buckets)){const im=new THREE.InstancedMesh(cube,mats[type]||mats.dirt,arr.length);im.castShadow=type!=='water';im.receiveShadow=true;const dummy=new THREE.Object3D();arr.forEach((b,i)=>{dummy.position.set(b.x,b.y,b.z);dummy.updateMatrix();im.setMatrixAt(i,dummy.matrix)});im.instanceMatrix.needsUpdate=true;im.userData.items=arr;im.userData.type=type;scene.add(im);blockMeshes.push(im);meshToType.set(im,type)}}
rebuild();
await generateWorld(40);
// Simple wandering voxel critters (decorative, lightweight mob prototype).
const mobs=[];
function spawnMob(x,z){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(.85,.55,.42),new THREE.MeshLambertMaterial({color:0xe8e2d2}));
 body.position.y=.55;g.add(body);
 const head=new THREE.Mesh(new THREE.BoxGeometry(.34,.34,.34),new THREE.MeshLambertMaterial({color:0xd7c7a8}));
 head.position.set(.48,.72,0);g.add(head);
 const legmat=new THREE.MeshLambertMaterial({color:0x51463c});
 for(const lx of [-.25,.25])for(const lz of [-.13,.13]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.13,.34,.13),legmat);leg.position.set(lx,.22,lz);g.add(leg)}
 const y=heightAt(Math.round(x),Math.round(z))+0.2;g.position.set(x,y,z);scene.add(g);
 mobs.push({g,dir:rand()*Math.PI*2,t:rand()*4,speed:.35+rand()*.35});
}
for(let i=0;i<7;i++){let x=Math.floor(rand()*28-14),z=Math.floor(rand()*28-14);spawnMob(x,z)}
const player={x:0,y:heightAt(0,0)+2.5,z:0,vy:0,yaw:0,pitch:0,onGround:false};camera.position.set(player.x,player.y,player.z);
let selected=0,inventory=[{type:'wood',n:12},{type:'planks',n:24},{type:'stone',n:20},{type:'dirt',n:24},{type:'leaves',n:12},{type:'sand',n:12}],day=0,started=false;const names=['Log','Planks','Stone','Dirt','Leaves','Sand'];const colors=['#80542f','#b58a50','#858585','#795033','#2f7d32','#d9c783'];
const bar=document.getElementById('hotbar');function drawBar(){bar.innerHTML='';inventory.forEach((it,i)=>{let el=document.createElement('div');el.className='slot'+(i===selected?' selected':'');el.innerHTML=`<div class="swatch" style="background:${colors[i]}"></div><span>${i+1}</span><span class="count">${it.n}</span>`;el.onclick=()=>{selected=i;drawBar()};bar.appendChild(el)})}drawBar();
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.opacity=0,1500)}
const ray=new THREE.Raycaster();function target(){ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(blockMeshes,false);return hits.find(h=>h.distance<6)||null}
function mine(){const h=target();if(!h)return;const arr=h.object.userData.items,b=arr[h.instanceId];if(!b||b.t==='bedrock'||b.t==='water')return;blocks.delete(key(b.x,b.y,b.z));let slot=inventory.find(i=>i.type===b.t);if(!slot&&['wood','stone','dirt','leaves','sand','planks'].includes(b.t)){slot=inventory.find(i=>i.type===b.t);if(slot)slot.n++}else if(slot)slot.n++;rebuild();drawBar()}
function place(){const h=target();if(!h)return;const it=inventory[selected];if(it.n<=0){toast('Out of blocks — mine some!');return}const b=h.object.userData.items[h.instanceId],n=h.face.normal;const x=Math.round(b.x+n.x),y=Math.round(b.y+n.y),z=Math.round(b.z+n.z);if(get(x,y,z))return;if(Math.abs(x-player.x)<.8&&Math.abs(z-player.z)<.8&&y>player.y-2&&y<player.y+1)return;put(x,y,z,it.type);it.n--;rebuild();drawBar()}
let keys={},locked=false;document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Digit')){let n=+e.code.slice(5)-1;if(n>=0&&n<6){selected=n;drawBar()}}if(e.code==='Space')e.preventDefault()});document.addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('click',()=>{if(started&&!isMobile())renderer.domElement.requestPointerLock()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(locked){player.yaw-=e.movementX*.0022;player.pitch-=e.movementY*.0022;player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch));camera.rotation.set(player.pitch,player.yaw,0)}});
renderer.domElement.addEventListener('contextmenu',e=>{e.preventDefault();if(started)place()});renderer.domElement.addEventListener('mousedown',e=>{if(started&&e.button===0&&!isMobile())mine()});
const isMobile=()=>matchMedia('(pointer:coarse)').matches||innerWidth<700;document.getElementById('mine').onclick=mine;document.getElementById('place').onclick=place;document.getElementById('jump').onclick=()=>{if(player.onGround)player.vy=7};document.getElementById('switch').onclick=()=>{selected=(selected+1)%6;drawBar()};
let stick={x:0,y:0},lookTouch=null,lastTouch=null;const stickEl=document.getElementById('stick'),nub=document.getElementById('nub');stickEl.addEventListener('touchstart',e=>{e.preventDefault();stickTouch=e.changedTouches[0].identifier;moveStick(e.changedTouches[0])},{passive:false});let stickTouch=null;function moveStick(t){const r=stickEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy,l=Math.hypot(dx,dy),m=40;if(l>m){dx=dx/l*m;dy=dy/l*m}stick.x=dx/m;stick.y=dy/m;nub.style.transform=`translate(${dx}px,${dy}px)`}document.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===stickTouch){e.preventDefault();moveStick(t)}else if(lookTouch===t.identifier&&lastTouch){player.yaw-=(t.clientX-lastTouch.x)*.008;player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch-(t.clientY-lastTouch.y)*.008));camera.rotation.set(player.pitch,player.yaw,0);lastTouch={x:t.clientX,y:t.clientY}}}},{passive:false});document.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===stickTouch){stickTouch=null;stick.x=stick.y=0;nub.style.transform=''}if(t.identifier===lookTouch){lookTouch=null;lastTouch=null}}});renderer.domElement.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX>innerWidth*.35&&t.clientY<innerHeight-165){lookTouch=t.identifier;lastTouch={x:t.clientX,y:t.clientY}}}},{passive:true});
function enterWorld(){started=true;document.getElementById('start').style.display='none';if(!isMobile())renderer.domElement.requestPointerLock()}
document.getElementById('go').onclick=enterWorld;
document.getElementById('newWorld').onclick=()=>{document.getElementById('mainOptions').style.display='none';document.getElementById('worldOptions').style.display='block'};
document.getElementById('backMenu').onclick=()=>{document.getElementById('worldOptions').style.display='none';document.getElementById('mainOptions').style.display='block'};
document.getElementById('createWorld').onclick=async()=>{document.getElementById('worldOptions').style.display='none';await generateWorld(Number(document.getElementById('worldSize').value)||40);player.x=0;player.z=0;player.y=groundBlockY(0,0)+2;player.vy=0;player.onGround=false;document.getElementById('start').style.display='none';enterWorld();toast('World created!')};
function collides(x,y,z){for(let dx of [-.28,.28])for(let dz of [-.28,.28])for(let dy of [-1.45,-.9,-.35,.15]){if(get(Math.floor(x+dx+.5),Math.floor(y+dy+.5),Math.floor(z+dz+.5)))return true}return false}
function groundBlockY(x,z){const bx=Math.round(x),bz=Math.round(z);for(let y=48;y>=0;y--){const b=get(bx,y,bz);if(b&&b.t!=='leaves'&&b.t!=='wood'&&b.t!=='water')return y;}return 4;}
let prev=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-prev)/1000,.05);prev=now;if(started){let forward=(keys.KeyW?1:0)-(keys.KeyS?1:0)-stick.y,side=(keys.KeyD?1:0)-(keys.KeyA?1:0)-stick.x;const moveLen=Math.hypot(forward,side);if(moveLen>1){forward/=moveLen;side/=moveLen}let dx=(Math.sin(player.yaw)*forward+Math.cos(player.yaw)*side)*5*dt,dz=(-Math.cos(player.yaw)*forward+Math.sin(player.yaw)*side)*5*dt;if(!collides(player.x+dx,player.y,player.z))player.x+=dx;if(!collides(player.x,player.y,player.z+dz))player.z+=dz;if((keys.Space)&&player.onGround)player.vy=7;player.vy-=18*dt;let ny=player.y+player.vy*dt;if(collides(player.x,ny,player.z)){if(player.vy<0)player.onGround=true;player.vy=0}else{player.y=ny;player.onGround=false}const floorY=groundBlockY(player.x,player.z)+1.52;if(player.y<floorY){player.y=floorY;player.vy=0;player.onGround=true}if(player.y< -8){player.x=0;player.z=0;player.y=groundBlockY(0,0)+2;player.vy=0;player.onGround=false}camera.position.set(player.x,player.y,player.z);
for(const mob of mobs){mob.t-=dt;if(mob.t<=0){mob.dir+=(rand()-.5)*2.8;mob.t=2+rand()*4}const mx=Math.sin(mob.dir)*mob.speed*dt,mz=Math.cos(mob.dir)*mob.speed*dt;const ground=heightAt(Math.round(mob.g.position.x+mx),Math.round(mob.g.position.z+mz));mob.g.position.x+=mx;mob.g.position.z+=mz;mob.g.position.y+=(ground+.2-mob.g.position.y)*Math.min(1,dt*5);mob.g.rotation.y=mob.dir}
day=(day+dt*.012)%(Math.PI*2);const daylight=Math.max(.12,Math.sin(day)*.5+.5);sun.position.set(Math.cos(day)*35,Math.sin(day)*45,20);sun.intensity=.25+daylight*1.8;hemi.intensity=.35+daylight*1.25;const sky=new THREE.Color().setRGB(.025+daylight*.5,.035+daylight*.68,.09+daylight*.88);scene.background.copy(sky);scene.fog.color.copy(sky);document.getElementById('stats').textContent=`XYZ ${player.x.toFixed(1)}, ${player.y.toFixed(1)}, ${player.z.toFixed(1)} · ${daylight>.35?'Day':'Night'} · ${blocks.size.toLocaleString()} blocks`; }renderer.render(scene,camera)}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
